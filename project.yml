name: Scrll
options:
  bundleIdPrefix: org.scrll
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Scrll:
    type: application
    platform: iOS
    sources:
      - path: Scrll
    info:
      path: Scrll/Info.plist
      properties:
        CFBundleDisplayName: Tidyroll
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: Tidyroll needs access to your photos so you can review, sort and clean up your library. Everything stays on your device.
        NSPhotoLibraryAddUsageDescription: Tidyroll needs permission to save changes, such as favorites and albums, to your photo library.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scrll.tidyroll
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  ScrllTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ScrllTests
    dependencies:
      - target: Scrll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scrll.tidyroll.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Scrll:
    build:
      targets:
        Scrll: all
        ScrllTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ScrllTests
