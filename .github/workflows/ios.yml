name: iOS build & test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted(k for k in devices if "iOS" in k)
          for runtime in reversed(runtimes):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"])
                  break
          ')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; xcrun simctl list devices available; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project Scrll.xcodeproj \
            -scheme Scrll \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1 && status=0 || status=$?
          grep -E "error:|Test Case .*(passed|failed)|Executed|\*\* (BUILD|TEST)" xcodebuild.log || true
          echo "---- last lines ----"
          tail -n 40 xcodebuild.log
          exit $status

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          if-no-files-found: ignore
